version: 2

updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # One PR for all minor and patch bumps; major bumps get their own PR for review
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Workflow actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  # Base image in Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
    ignore:
      # The 3.14-slim tag already floats over patch releases. A new Python minor version
      # is upgraded by hand, together with .python-version and requires-python.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
