x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clipster:
    build: .
    image: clipster-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND:-127.0.0.1:9999}:8000"
    volumes:
      - ./data:/data
    logging: *default-logging
    # Hardening: the app only needs to write to /data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional HTTPS reverse proxy with automatic Let's Encrypt certificates.
  # Enable with COMPOSE_PROFILES=caddy in .env
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    depends_on:
      clipster:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
